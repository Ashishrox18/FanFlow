name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck
        
      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Unit Tests & Coverage
        run: npm run test:coverage

      - name: Build Next.js App
        run: npm run build
